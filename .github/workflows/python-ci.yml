
name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -v
      
      - name: Build Docker image
        run: |
          docker build -t python-todo-cli:ci .
      
      - name: Build FastAPI Docker image
        run: |
          docker build \
            -f Dockerfile.web \
            -t python-todo-api:ci .

      - name: Smoke test FastAPI container
        run: |
          docker run -d --name todo-api-ci \
            -p 127.0.0.1:8000:8000 python-todo-api:ci

          for i in $(seq 1 20); do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then
              docker rm -f todo-api-ci
              exit 0
            fi
            sleep 1
          done

          docker logs todo-api-ci
          docker rm -f todo-api-ci
          exit 1
      
      - name: Check database migrations
        run: |
          TODO_DB_PATH=ci-check.db alembic upgrade head
          TODO_DB_PATH=ci-check.db alembic check

  
  postgres-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start PostgreSQL and API
        run: |
          export POSTGRES_USER=todo_user
          export POSTGRES_DB=todo_db
          export POSTGRES_PASSWORD=ci_local_only_password_2026

          docker compose up -d --build

          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps -a
          docker compose logs
          exit 1

      - name: Verify PostgreSQL CRUD
        run: |
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/tasks \
            -H "Content-Type: application/json" \
            -d '{"title":"CI PostgreSQL test"}'

          echo

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/tasks

      - name: Clean up containers
        if: always()
        env:
          POSTGRES_USER: todo_user
          POSTGRES_DB: todo_db
          POSTGRES_PASSWORD: ci_local_only_password_2026
        run: |
          docker compose logs || true
          docker compose down -v || true


  postgres-pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install \
            -r requirements-dev.txt

      - name: Start PostgreSQL test database
        run: |
          docker compose \
            -f compose.test.yaml \
            up -d --wait

      - name: Run PostgreSQL integration tests
        env:
          RUN_POSTGRES_TESTS: "1"
        run: |
          python -m pytest -v -m postgres

      - name: Clean up test database
        if: always()
        run: |
          docker compose \
            -f compose.test.yaml logs

          docker compose \
            -f compose.test.yaml down
  
  redis-pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install \
            -r requirements-dev.txt \
            -r requirements-api.txt

      - name: Start Redis test service
        run: |
          docker compose \
            -f compose.test.yaml \
            up -d --wait redis-test

      - name: Run Redis integration tests
        env:
          RUN_REDIS_TESTS: "1"
        run: |
          python -m pytest -v -m redis

      - name: Clean up test services
        if: always()
        run: |
          docker compose \
            -f compose.test.yaml logs

          docker compose \
            -f compose.test.yaml down

