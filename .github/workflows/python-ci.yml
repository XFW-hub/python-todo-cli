
name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -v
      
      - name: Build Docker image
        run: |
          docker build -t python-todo-cli:ci .
      
      - name: Build FastAPI Docker image
        run: |
          docker build \
            -f Dockerfile.web \
            -t python-todo-api:ci .

      - name: Smoke test FastAPI container
        run: |
          docker run -d --name todo-api-ci \
            -p 127.0.0.1:8000:8000 python-todo-api:ci

          for i in $(seq 1 20); do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then
              docker rm -f todo-api-ci
              exit 0
            fi
            sleep 1
          done

          docker logs todo-api-ci
          docker rm -f todo-api-ci
          exit 1
