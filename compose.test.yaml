
services:
  db-test:
    image: postgres:17

    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: todo_test_db

    ports:
      - "127.0.0.1:5433:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U test_user -d todo_test_db
      interval: 3s
      timeout: 3s
      retries: 15

    tmpfs:
      - /var/lib/postgresql/data
